name: Update Profile Data

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: profile-data
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    env:
      PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update README sections
        env:
          GH_TOKEN: ${{ env.PROFILE_STATS_TOKEN != '' && env.PROFILE_STATS_TOKEN || github.token }}
          PROFILE_INCLUDE_PRIVATE_REPOS: ${{ env.PROFILE_STATS_TOKEN != '' && 'true' || 'false' }}
          PROFILE_FETCH_ATTEMPTS: "3"
        run: |
          for attempt in 1 2 3; do
            if python scripts/update_readme_data.py; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((2 ** (attempt - 1)))
          done

      - name: Commit updated README
        run: |
          if git diff --quiet -- README.md assets/images/github-footprint.svg; then
            echo "No README changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/images/github-footprint.svg
          git commit -m "chore: update profile data"
          git push
